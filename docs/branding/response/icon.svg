<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept "Response": a double quotation mark, the sung words. The first
       stroke is white (the call), the second gold (the response). Original
       artwork for this project. One comma shape (a disc plus a tail) is used
       twice. Rasterised by docs/branding/tools/build.py. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4379DD"/>
      <stop offset="1" stop-color="#2447A3"/>
    </linearGradient>
    <!-- Comma in local coordinates: disc of radius 104 at the origin, tail
         sweeping down and to the left from the disc's right side. -->
    <g id="comma">
      <circle cx="0" cy="0" r="104"/>
      <path d="M 104 0 C 106 104 48 188 -44 236 C 10 178 50 130 34 92 Z"/>
    </g>
  </defs>
  <rect id="bg" x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <g id="mark" transform="translate(512 512) scale(1.2)">
    <!-- The pair spans y -104..236 in comma units; shifted up to centre it. -->
    <g transform="translate(0 -66)">
      <!-- Call: white. -->
      <use href="#comma" fill="#FFFFFF" transform="translate(-128 0)"/>
      <!-- Response: gold. -->
      <use href="#comma" fill="#F6B73C" transform="translate(128 0)"/>
    </g>
  </g>
</svg>
