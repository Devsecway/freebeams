<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- FreeBeams app icon: a projector lens at the bottom-left throws three beams of light up to a
       bright slide, on an indigo tile (macOS icon grid: 824 px tile on a 1024 px canvas).
       Original artwork for this project. Rasterised by packaging/icons/make-icons.sh;
       the brand guide is docs/branding/README.md. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1A1750"/>
      <stop offset="1" stop-color="#4740D8"/>
    </linearGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="238" y1="776" x2="592" y2="456">
      <stop offset="0" stop-color="#FFC94D" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="238" cy="776" r="270">
      <stop offset="0" stop-color="#FFC94D" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFC94D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="232"/></clipPath>
  </defs>
  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="232" fill="url(#tile)"/>
  <!-- Lamp glow on the tile around the lens -->
  <circle cx="238" cy="776" r="270" fill="url(#glow)" clip-path="url(#tileClip)"/>
  <!-- Three beams from the lens to the slide's bottom edge (the slide covers their ends) -->
  <polygon points="238,776 392,456 511,456" fill="url(#beam)"/>
  <polygon points="238,776 539,456 645,456" fill="url(#beam)" fill-opacity="0.85"/>
  <polygon points="238,776 673,456 792,456" fill="url(#beam)"/>
  <!-- The lit slide -->
  <rect x="352" y="222" width="480" height="270" rx="36" fill="#FFFFFF"/>
  <!-- The lens -->
  <circle cx="238" cy="776" r="66" fill="#FFC94D"/>
  <circle cx="238" cy="776" r="36" fill="#FFFFFF"/>
</svg>
